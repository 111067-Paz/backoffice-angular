<header class="h-[86px] bg-[#292738] text-white flex-shrink-0 z-40 flex items-center justify-between px-6 border-b-4 border-[#464254] shadow-md">
  <!-- Izquierda: Identidad Institucional Arcade con Brand-Mark dorado -->
  <div class="flex items-center gap-5">
    <div class="flex items-center gap-3">
      <div class="w-[42px] h-[44px] bg-[#f6c66a] flex items-center justify-center shadow-[3px_3px_0_#13121f] text-[#292738] border border-[#d78a31]">
        <app-logo-utn class="h-6 w-auto block" />
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-lg tracking-tight text-white font-sans">UTN FRC</span>
          <span class="font-medium text-lg text-[#ddd8e0] font-sans">Backoffice</span>
        </div>
        <small class="block font-pixel text-[8px] tracking-[1.5px] text-[#a6a0af] mt-0.5">TEMA 12 • GOBERNANZA & ANALÍTICA</small>
      </div>
    </div>

    <!-- Píldora HUD Kafka Status -->
    <div class="hidden lg:flex items-center gap-2.5 bg-[#393447] border border-[#65543d] border-b-[3px] border-b-[#171520] px-3.5 py-1.5 text-xs text-[#f6ce76] shadow-sm">
      <span class="w-2.5 h-2.5 rounded-full bg-[#378260] shadow-[0_0_0_2px_#37826040] animate-pulse"></span>
      <span class="font-pixel text-[10px] tracking-wide text-white">KAFKA GATEWAY:</span>
      <strong class="font-pixel text-[11px] text-[#f6c66a]">{{ systemStatus().servicesOnline }}/{{ systemStatus().servicesTotal }} SERVICIOS OK</strong>
    </div>
  </div>

  <!-- Derecha: HUD de Seguridad & Perfil Arcade -->
  <div class="flex items-center gap-4">
    <!-- Stat 2FA Verificado -->
    <div class="hidden sm:flex items-center gap-2 bg-[#3a3548] border border-[#5c5569] px-3 py-1.5 shadow-[2px_2px_0_#171520]">
      <span class="material-symbols-outlined text-[16px] text-[#378260]">verified_user</span>
      <span class="font-pixel text-[9px] text-[#ddd8e0] tracking-wider">2FA ACTIVO</span>
    </div>

    <!-- Perfil del Administrador Arcade -->
    <div class="flex items-center gap-3 bg-[#393447] px-3.5 py-1.5 border border-[#51495c] border-b-[3px] border-b-[#171420] shadow-[3px_3px_0_#13121f]">
      <div class="flex flex-col text-right">
        <span class="text-xs font-bold leading-tight text-white font-sans">{{ systemStatus().userName }}</span>
        <span class="text-[9px] text-[#f6c66a] font-pixel leading-tight">{{ systemStatus().userRole }}</span>
      </div>
      <div class="relative w-9 h-9 bg-[#665677] border-2 border-[#98869d] shadow-[2px_2px_0_#171420] flex items-center justify-center text-white font-bold font-pixel text-xs">
        {{ systemStatus().userInitials }}
        <span class="absolute -right-1 -bottom-1 w-2.5 h-2.5 bg-[#9ac891] border-2 border-[#292738] rounded-full"></span>
      </div>
    </div>
  </div>
</header>
