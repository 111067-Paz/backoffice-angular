<header class="h-16 bg-[#0F172A] text-white flex-shrink-0 z-40 flex items-center justify-between px-6 shadow-md border-b border-slate-800">
  <!-- Izquierda: Identidad Institucional & Gateway -->
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-3">
      <img alt="UTN FRC Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIt3tGnW5SVc1zbPEdAMtV-j-r6HZjogtM3Q8XhLJSfY4VgX0MJHuqe6ZF8t3EucQxIBw4k_iA7BdJMA-LgjoBqg4xlXLU-U3Ui5TcBDx5L8mfGEiuVKeEDnimKDdCtZy8gl3J3hpYmfXKm2lztVzl-b4RsZtHNcsKTQB1huD0x4JnZ3c93MFXf8W3RlMXkJV8w3nMth7LXxbj0uckVA0RFqo8yFNtEn65_UQZyzq6fG5yG9WXkAbI">
      <div>
        <span class="font-bold text-sm tracking-tight leading-tight block">UTN FRC Backoffice</span>
        <span class="text-slate-400 text-xs font-mono block">Tema 12 • Angular 21 SPA</span>
      </div>
    </div>

    <!-- Píldora Kafka -->
    <div class="hidden md:flex items-center gap-2 bg-emerald-950/70 border border-emerald-500/30 px-3 py-1 rounded-full text-xs text-emerald-300">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="font-mono">Kafka API Gateway ({{ systemStatus().servicesOnline }}/{{ systemStatus().servicesTotal }} Servicios OK)</span>
    </div>
  </div>

  <!-- Derecha: Seguridad 2FA & Perfil Docente -->
  <div class="flex items-center gap-3">
    <div class="hidden sm:flex items-center gap-1.5 bg-blue-900/50 border border-blue-400/30 px-3 py-1 rounded-full text-blue-200 text-xs">
      <span class="material-symbols-outlined text-[15px] text-blue-300">verified_user</span>
      <span class="font-medium tracking-wide uppercase text-[10px]">2FA Verificado</span>
    </div>

    <div class="flex items-center gap-3 bg-slate-800/80 px-3.5 py-1.5 rounded-lg border border-slate-700/60">
      <div class="flex flex-col text-right">
        <span class="text-xs font-semibold leading-tight text-white">{{ systemStatus().userName }}</span>
        <span class="text-[10px] text-slate-300 font-mono leading-tight">Rol: {{ systemStatus().userRole }}</span>
      </div>
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shadow-sm font-semibold text-xs">
        {{ systemStatus().userInitials }}
      </div>
    </div>
  </div>
</header>
